<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyDrop | Snacks</title>
  <script src="{{ url_for('static', filename='js/products.js') }}"></script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo1.webp') }}">

  <!-- Bootstrap, FontAwesome & Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Centralized Stylesheet & Scripts -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/cart-helpers.js') }}"></script>
  <script src="{{ url_for('static', filename='js/product-modal.js') }}"></script>
  <script src="{{ url_for('static', filename='js/command-palette.js') }}"></script>
</head>
<body>



  <!-- Premium Sticky Floating Navbar -->
  <nav class="navbar">
      <div class="container navbar-container">
          <a href="{{ url_for('index') }}" class="logo">
              <i class="fas fa-shopping-basket"></i> Daily<span>Drop</span>
          </a>
          <div class="search-bar">
              <input type="text" id="searchInput" placeholder="Search snacks..." />
          </div>
          <div class="nav-actions">
              {% if 'user_id' in session %}
                  <span class="welcome-text">Hi, {{ session['name'] }}</span>
                  <a href="{{ url_for('orders') }}" class="login-btn-outline"><i class="fas fa-box"></i> My Orders</a>
                  <a href="{{ url_for('logout') }}" class="login-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
              {% else %}
                  <a href="{{ url_for('login') }}" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
              {% endif %}
              <a href="{{ url_for('cart') }}" class="cart-icon">
                  <i class="fas fa-shopping-cart"></i> My Cart <span id="cart-count">0</span>
              </a>
          </div>
      </div>
  </nav>

  <div class="container main-container">
    <!-- Categories sidebar -->
    <div class="categories-sidebar">
      <h3 class="categories-header"><i class="fas fa-th-list me-2" style="color: var(--primary);"></i> Categories</h3>
      <div class="category-item active" data-category="all">
        <span>All Products</span> <i class="fas fa-chevron-right fs-xs"></i>
      </div>
      <div class="category-item" data-category="soft drinks">
        <span>Soft Drinks</span> <i class="fas fa-chevron-right fs-xs"></i>
      </div>
      <div class="category-item" data-category="energy bars">
        <span>Energy Bars</span> <i class="fas fa-chevron-right fs-xs"></i>
      </div>
      <div class="category-item" data-category="cookie">
        <span>Cookie</span> <i class="fas fa-chevron-right fs-xs"></i>
      </div>
      <div class="category-item" data-category="chips">
        <span>Chips</span> <i class="fas fa-chevron-right fs-xs"></i>
      </div>
    </div>

    <!-- Products section -->
    <div class="products-section">
      <h2 class="products-title">Snacks</h2>
      <h3 class="category-title" id="active-category">All Products</h3>

      <div class="products-grid" id="productsGrid">
        <!-- Products load dynamically -->
      </div>
    </div>
  </div>

  <div class="scroll-to-top" onclick="scrollToTop()">
    <i class="fas fa-arrow-up"></i>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Live search
    document.getElementById('searchInput').addEventListener('input', function() {
      const filter = this.value.toLowerCase();
      const cards = document.querySelectorAll('.product-card');
      cards.forEach(card => {
        const title = card.getAttribute('data-title').toLowerCase();
        card.style.display = title.includes(filter) ? '' : 'none';
      });
    });

    // Scroll to Top Functionality
    const scrollButton = document.querySelector('.scroll-to-top');
    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) {
        scrollButton.classList.add('show');
      } else {
        scrollButton.classList.remove('show');
      }
    });
    
    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    // Load products from centralized products database
    const categoryName = "Snacks";
    let products = [];

    function getCategoryProducts() {
      return (window.productsDB || [])
        .filter(p => p.category === categoryName)
        .map(p => ({
          id: p.id,
          name: p.title,
          price: p.price,
          image: p.image,
          category: p.subcategory || '', // Map subcategory to category for legacy frontend compatibility
          description: p.description
        }));
    }

    // Infinite Scroll / Batch Rendering Variables
    let currentCategoryProducts = [];
    let renderedCount = 0;
    const batchSize = 12;

    // Function to render products with pagination / batching
    function renderProducts(category = 'all') {
      products = getCategoryProducts();
      const productsGrid = document.getElementById('productsGrid');
      productsGrid.innerHTML = '';
      renderedCount = 0;

      currentCategoryProducts = category === 'all'
        ? products
        : products.filter(product => (product.category || '').toLowerCase() === category.toLowerCase());

      loadMoreProducts();
    }

    document.addEventListener('productsSynced', function() {
      const activeCat = document.querySelector('.category-item.active')?.dataset?.category || 'all';
      renderProducts(activeCat);
    });

    function loadMoreProducts() {
      const productsGrid = document.getElementById('productsGrid');
      const nextBatch = currentCategoryProducts.slice(renderedCount, renderedCount + batchSize);
      
      if (nextBatch.length === 0) return;

      nextBatch.forEach(product => {
        const productCard = document.createElement('div');
        productCard.className = 'product-card';
        productCard.setAttribute('data-title', product.name);

        productCard.innerHTML = `
          <div class="product-image-container">
            <img src="${product.image}" alt="${product.name}" class="product-image" loading="lazy" />
          </div>
          <div class="product-details">
            <div class="product-category">${product.category}</div>
            <div class="product-title">${product.name}</div>
            <div class="product-price">Rs. ${product.price}</div>
            <div class="product-actions">
              <button class="view-detail" data-bs-toggle="modal" data-bs-target="#productModal" onclick="showDetails('${product.name.replace(/'/g, "\\'")}', 'Rs.${product.price}', '${product.image}')">Details</button>
              <button class="add-to-cart-btn" onclick="addToCart('${product.name.replace(/'/g, "\\'")}', ${product.price}, '${product.image}')"><i class="fas fa-shopping-basket"></i> Add</button>
            </div>
          </div>
        `;

        productsGrid.appendChild(productCard);
      });

      renderedCount += nextBatch.length;
      updateProductButtons();
    }

    // Listen for scroll events to trigger infinite scroll
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 600) {
        loadMoreProducts();
      }
    });

    // Initialize with all products
    renderProducts();

    // Category selection
    const categoryItems = document.querySelectorAll('.category-item');
    const activeCategoryTitle = document.getElementById('active-category');

    categoryItems.forEach(item => {
      item.addEventListener('click', function() {
        // Update active class
        categoryItems.forEach(i => i.classList.remove('active'));
        this.classList.add('active');

        // Get category
        const category = this.dataset.category;

        // Update category title
        activeCategoryTitle.textContent = this.querySelector('span').textContent.trim();

        // Render products
        renderProducts(category);
      });
    });

  </script>
</body>
</html>
